name: Build FPAutoMine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4

      - name: Checkout FakePlayerPlus
        uses: actions/checkout@v4
        with:
          repository: xiplugin/FakePlayerPlus
          path: fakeplayerplus

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Publish FakePlayerPlus API to Maven local
        working-directory: fakeplayerplus
        run: |
          chmod +x gradlew
          ./gradlew :api:publishToMavenLocal --no-daemon

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Build addon
        shell: bash
        run: |
          set +e
          gradle build --no-daemon --console=plain > build.log 2>&1
          code=$?
          cat build.log
          # Đưa các dòng lỗi thành annotation để đọc được qua API khi log không tải được.
          grep -E "error:|^e: |What went wrong|Could not|Execution failed|wrong version|cannot access|does not exist|FAILED|^> " build.log \
            | head -n 20 | while IFS= read -r line; do echo "::error title=Build error::$line"; done
          tail -n 25 build.log | while IFS= read -r line; do echo "::error title=Log tail::$line"; done
          exit $code

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: FPAutoMine
          path: build/libs/*.jar
