name: Build FPAutoMine

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout addon
        uses: actions/checkout@v4

      - name: Checkout FakePlayerPlus
        uses: actions/checkout@v4
        with:
          repository: xiplugin/FakePlayerPlus
          path: fakeplayerplus

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish FakePlayerPlus API to Maven local
        working-directory: fakeplayerplus
        run: |
          chmod +x gradlew
          ./gradlew :api:publishToMavenLocal --no-daemon

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build addon
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: FPAutoMine
          path: build/libs/*.jar
